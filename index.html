<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Race to Dubai | VRA Golf Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app">
    <header class="app-header">
      <div class="logo-container">
        <div class="logo-icon">⛳️</div>
        <div class="logo-text">
          <h1>Race to Dubai</h1>
          <p>VRA CLUB • 2026 SEASON</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="theme-btn" aria-label="Toggle Dark Mode">☀️</button>
      </div>
    </header>

    <main class="race-track-container" id="race-track">
      <div class="track-labels">
        <span class="label-start">VRA CLUBHOUSE</span>
        <div class="track-arrow"></div>
        <span class="label-end">DUBAI</span>
      </div>
      <div class="track-grid">
        <!-- Lanes will be generated here -->
      </div>
    </main>

    <section class="standings-section">
      <div class="standings-header">
        <h2>CURRENT STANDINGS</h2>
        <span class="update-time">UPDATE: 2 HRS AGO</span>
      </div>
      <div class="standings-list" id="standings-list">
        <!-- List items will be generated here -->
      </div>
      <button class="view-all-btn">View All 8 Players ▾</button>
    </section>
  </div>
  <script type="module" src="main.js"></script>
</body>

</html>
